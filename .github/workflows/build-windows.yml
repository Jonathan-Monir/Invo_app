name: Build Windows EXE

# Builds the INVO Windows app with PyInstaller on a native Windows runner.
# - Runs on pushes to main / windows-build (so you get a build right away),
#   on version tags (v1.0.0, ...) which also publish a GitHub Release,
#   and on manual "Run workflow" (workflow_dispatch).
on:
  push:
    branches: [main, windows-build]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # required so tag builds can create a Release

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm INVO.spec

      - name: Bundle data + assets next to the exe
        run: |
          Copy-Item -Path images    -Destination dist/INVO/images -Recurse -Force
          Copy-Item -Path setups.db -Destination dist/INVO/setups.db -Force

      - name: Zip the app folder
        run: Compress-Archive -Path dist/INVO/* -DestinationPath INVO-windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: INVO-windows
          path: INVO-windows.zip
          retention-days: 30

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" INVO-windows.zip --title "INVO $env:GITHUB_REF_NAME" --notes "Windows build of INVO. Unzip and run INVO.exe."
